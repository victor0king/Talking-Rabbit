<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forecast — Talking Rabbitt</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css?v=1.1.0">
<link rel="stylesheet" href="/css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>

  <div class="main">
    <div class="topbar">
      <div>
        <div class="topbar-title">Forecast</div>
        <div class="topbar-sub">Project future performance with scikit-learn</div>
      </div>
      <div class="dataset-pill" data-dataset-pill></div>
    </div>

    <div class="content" data-requires-dataset>
      <div class="card" style="margin-bottom:20px">
        <div class="metric-controls" style="display:flex; flex-wrap:wrap; gap:16px; align-items:flex-end;">
          <div>
            <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px">Target Metric</label>
            <select id="metric-select" class="filter-select" style="min-width:160px;"></select>
          </div>
          <div>
            <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px">Forecasting Model</label>
            <select id="model-select" class="filter-select" style="min-width:220px;">
              <option value="prophet">Prophet (Seasonality + Trend)</option>
              <option value="linear_regression">Linear Regression (Baseline)</option>
            </select>
          </div>
          <div>
            <label style="display:block; font-size:12px; color:var(--text-muted); margin-bottom:6px">Forecast Horizon</label>
            <input type="number" id="horizon-input" value="6" min="1" max="24" class="filter-select" style="width:90px">
          </div>
          <button id="run-forecast" class="btn btn-primary" style="height:36px;"><i class="ti ti-player-play"></i> Run Forecast</button>
        </div>
      </div>

      <div id="forecast-result">
        <div class="empty-state"><i class="ti ti-trending-up"></i>Choose a metric and run a forecast.</div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/forecast.js"></script>
</body>
</html>
